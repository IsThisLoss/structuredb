root: /tmp/db
port: 50051
logger:
  level: debug
  console: true
compaction:
  interval: 60000
flush:
  interval: 1000
wal:
  clean:
    interval: 60000
lsm:
  max_records_in_mem_table: 10000
  max_ro_mem_tables: 1
  page_size: 4096
  page_cache_capacity: 1024
replication:
  # role: leader | follower
  role: leader
  # for followers: address of the leader to stream the WAL from
  # leader_address: "127.0.0.1:50051"
  # leader: how often (ms) to re-scan the WAL for new pages to ship
  poll_interval: 200
